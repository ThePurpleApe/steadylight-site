<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SteadyLight</title>
<style>
  :root { --bg: #F7F9FC; --text: #0D1B3E; --muted: #4A5B78; --rule: #C5D3EA; --link: #1D4ED8; --mark: #FDE68A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D1B3E; --text: #F1F5F9; --muted: #A8B8D4; --rule: #2F4C88; --link: #93C5FD; --mark: #7A5200; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; overflow-wrap: anywhere; }
  h1, h2 { font-family: Georgia, "Times New Roman", serif; line-height: 1.25; }
  h1 { font-size: 34px; margin: 0 0 4px; }
  h2 { font-size: 22px; margin: 36px 0 8px; }
  a { color: var(--link); }
  li { margin: 6px 0; }
  mark { background: var(--mark); color: inherit; padding: 0 2px; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>SteadyLight</h1>
  <p>A tutor that runs on your own computer and helps you find the answer yourself, one step at a time.</p>
  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
    <li><a href="terms/">Terms of Use</a></li>
  </ul>
</main>
</body>
</html>
